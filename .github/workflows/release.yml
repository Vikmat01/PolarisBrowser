name: Release

# Add release-notes/vX.Y.md (and bump versionName) on main → build a signed APK → publish release vX.Y.
# A tag push v* or a manual run works too. The app's built-in updater picks the release up automatically.
on:
  push:
    branches: [main]
    paths: ['release-notes/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Add the signing secrets first (see README)"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > polaris.jks
          printf 'storeFile=polaris.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "PolarisBrowser-$VERSION.apk"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          NOTES="release-notes/v$VERSION.md"; [ -f "$NOTES" ] || NOTES=/dev/null
          echo "NOTES=$NOTES" >> $GITHUB_ENV

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Polaris Browser ${{ env.VERSION }}
          body_path: ${{ env.NOTES }}
          files: PolarisBrowser-${{ env.VERSION }}.apk
          make_latest: true
